<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>CheckStock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand bg-dark navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/stock">CheckStock</a>
    <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link" href="/stock">Остатки</a></li>
      <li class="nav-item"><a class="nav-link" href="/movements">Движения</a></li>
      <li class="nav-item"><a class="nav-link" href="/warehouses">Склады</a></li>
    </ul>
  </div>
</nav>
<div class="container pb-5">
  {% if request.query_params.get('err') %}
    <div class="alert alert-danger">{{ request.query_params.get('err') }}</div>
  {% endif %}
  {% if request.query_params.get('ok') %}
    <div class="alert alert-success">{{ request.query_params.get('ok') }}</div>
  {% endif %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
